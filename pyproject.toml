[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "colorstack-ai"
version = "0.1.0"
description = "Discord ingestion layer for ColorStack"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "discord.py>=2.6,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
colorstack-ai = "colorstack_ai.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
