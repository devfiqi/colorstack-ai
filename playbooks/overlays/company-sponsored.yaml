key: company_sponsored
name: Company-Sponsored Overlay
event_type: company_sponsored
version: "1"
overlay: true
detection_keywords: [sponsored by, company-sponsored, sponsor]
requirements:
  - {key: sponsor_contact, name: Sponsor contact, required: true, criticality: critical, sponsor_dependent: true, ideal_lead_days: 45, minimum_lead_days: 21, done_when: [primary sponsor contact confirmed], evaluation: {event_fields: [sponsor], task_keywords: [sponsor contact], completion_terms: [confirmed], completion_mode: terms}}
  - {key: sponsor_objectives, name: Sponsor objectives, required: true, criticality: high, sponsor_dependent: true, dependencies: [sponsor_contact], done_when: [objectives documented and agreed], evaluation: {task_keywords: [sponsor objectives, sponsor goals], completion_terms: [agreed, approved, documented], completion_mode: terms}}
  - {key: sponsor_approval, name: Sponsor approval, required: true, criticality: high, sponsor_dependent: true, dependencies: [sponsor_objectives], done_when: [event plan approved by sponsor], evaluation: {task_keywords: [sponsor approval, sponsor sign-off], completion_terms: [approved, signed off], completion_mode: terms}}
  - {key: branding, name: Branding requirements, required: true, criticality: high, sponsor_dependent: true, dependencies: [sponsor_contact], done_when: [branding guidance received and approved], evaluation: {task_keywords: [branding, logo usage, logo], completion_terms: [approved, received], completion_mode: terms}}
  - {key: event_description, name: Event description, required: true, criticality: medium, sponsor_dependent: true, dependencies: [sponsor_objectives], done_when: [sponsor-approved description available], evaluation: {task_keywords: [event description], completion_terms: [approved, final], completion_mode: terms}}
  - {key: demographics, name: Attendee demographics, required: true, criticality: medium, sponsor_dependent: true, done_when: [requested demographic summary prepared], evaluation: {task_keywords: [attendee demographics, demographics], completion_terms: [prepared, shared], completion_mode: terms}}
  - {key: registration_link, name: Registration link, required: true, criticality: high, sponsor_dependent: true, done_when: [working link shared with sponsor], evaluation: {event_fields: [registration], task_keywords: [registration link], completion_terms: [live, shared], completion_mode: terms}}
  - {key: budget_approval, name: Budget approval, required: true, criticality: critical, sponsor_dependent: true, ideal_lead_days: 30, minimum_lead_days: 14, done_when: [sponsor-funded budget approved], evaluation: {event_fields: [funding_status], task_keywords: [budget approval, funding], completion_terms: [approved], completion_mode: terms}}
  - {key: reimbursement, name: Reimbursement requirements, required: true, criticality: high, sponsor_dependent: true, dependencies: [budget_approval], done_when: [process, receipts, and deadline documented], evaluation: {task_keywords: [reimbursement, receipt], completion_terms: [documented, confirmed], completion_mode: terms}}
  - {key: attendance_reporting, name: Attendance reporting, required: true, criticality: medium, sponsor_dependent: true, done_when: [report format and owner defined], evaluation: {task_keywords: [attendance report, attendance reporting], completion_mode: task_completed}}
  - {key: photos, name: Photos, criticality: medium, sponsor_dependent: true, done_when: [photo coverage and delivery confirmed], evaluation: {task_keywords: [sponsor photos, photography], completion_terms: [confirmed, delivered], completion_mode: terms}}
  - {key: post_event_recap, name: Post-event recap, required: true, criticality: high, sponsor_dependent: true, dependencies: [attendance_reporting], done_when: [recap delivered to sponsor], evaluation: {task_keywords: [sponsor recap, post-event recap], completion_terms: [sent, delivered], completion_mode: terms}}
  - {key: promised_deliverables, name: Promised sponsor deliverables, required: true, criticality: critical, sponsor_dependent: true, dependencies: [sponsor_objectives], done_when: [all promised deliverables tracked and completed], evaluation: {task_keywords: [sponsor deliverables, deliverables], completion_terms: [completed, delivered], completion_mode: terms}}
